# ─────────────────────────────────────────────────────────────────────────────
# Daily Insider Tracker Scraper
#
# Schedule: 23:00 CET every day (22:00 UTC winter / adjust manually for summer)
# Budget:   ~23 scrapers × ~2 min each = ~50 min/day = ~1,500 min/month
#           Well within GitHub Actions free tier (2,000 min/month).
#
# Secrets required (Settings → Secrets → Actions):
#   SUPABASE_URL               https://xxxx.supabase.co
#   SUPABASE_SERVICE_ROLE_KEY  service_role key — required now that
#                               insider_transactions blocks anon/authenticated
#                               writes via RLS (migrations/020)
#   SUPABASE_KEY                older name, still read as a fallback
#   DART_API_KEY   DART Open API key (South Korea FSS/DART)
# ─────────────────────────────────────────────────────────────────────────────

name: Daily Scraper

on:
  push:
    branches: [main]        # Accept push events so runs don't fail; job guard skips execution
  schedule:
    - cron: '0 22 * * *'   # 22:00 UTC = 23:00 CET (UTC+1)
  workflow_dispatch:        # Manual trigger from the Actions tab
    inputs:
      country:
        description: 'Single country code to test (NL, DE, FR …) — leave empty to run all'
        required: false
        default: ''
      lookback_days:
        description: "Override LOOKBACK_DAYS for all scrapers (default: each scraper's own default)"
        required: false
        default: ''

env:
  NODE_ENV: production

jobs:
  scrape:
    name: Scrape all markets
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 90     # Hard cap; full run should finish in ~60 min
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      DART_API_KEY: ${{ secrets.DART_API_KEY }}
      LOOKBACK_DAYS: ${{ github.event.inputs.lookback_days || '' }}
      # Market steps go through run-all.js so every run lands in scraper_runs
      # (daily-health-check.js alerts on missing/zero-row runs); 30 min floor
      # per market since these steps previously had no per-scraper timeout.
      SCRAPER_TIMEOUT_MS: '1800000'

    steps:
      # ── Setup ──────────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'      # Cache node_modules between runs (saves ~30 sec)

      - name: Install dependencies
        run: npm ci

      - name: Install system tools
        continue-on-error: true   # poppler/tesseract/qpdf failure must not block scrapers that don't need them
        run: sudo apt-get update -qq && sudo apt-get install -y poppler-utils tesseract-ocr qpdf

      # ── Europe ─────────────────────────────────────────────────────────────
      - name: 🇳🇱 Netherlands (AFM)
        if: ${{ github.event.inputs.country == '' || github.event.inputs.country == 'NL' }}
        continue-on-error: true
        run: node run-all.js NL

      - name: 🇩🇪 Germany (BaFin)
        if: ${{ github.event.inputs.country == '' || github.event.inputs.country == 'DE' }}
        continue-on-error: true
        run: node run-all.js DE

      - name: 🇩🇰 Denmark (Finanstilsynet)
        if: ${{ github.event.inputs.country == '' || github.event.inputs.country == 'DK' }}
        continue-on-error: true
        run: node run-all.js DK

      - name: 🇸🇪 Sweden (Finansinspektionen)
        if: ${{ github.event.inputs.country == '' || github.event.inputs.country == 'SE' }}
        continue-on-error: true
        run: node run-all.js SE


      - name: 🇫🇷 France (AMF)
        if: ${{ github.event.inputs.country == '' || github.event.inputs.country == 'FR' }}
        continue-on-error: true
        timeout-minutes: 15   # PDF-heavy — many AMF documents to download
        run: node run-all.js FR

      - name: 🇫🇮 Finland (FIN-FSA)
        if: ${{ github.event.inputs.country == '' || github.event.inputs.country == 'FI' }}
        continue-on-error: true
        run: node run-all.js FI

      - name: 🇪🇸 Spain (CNMV)
        if: ${{ github.event.inputs.country == '' || github.event.inputs.country == 'ES' }}
        continue-on-error: true
        run: node run-all.js ES

      - name: 🇵🇹 Portugal (CMVM)
        if: ${{ github.event.inputs.country == '' || github.event.inputs.country == 'PT' }}
        continue-on-error: true
        timeout-minutes: 12   # Puppeteer can hang — cap it so NO/CH/KR aren't starved
        run: node run-all.js PT

      - name: 🇧🇪 Belgium (FSMA)
        if: ${{ github.event.inputs.country == '' || github.event.inputs.country == 'BE' }}
        continue-on-error: true
        run: node run-all.js BE

      - name: 🇱🇺 Luxembourg (LuxSE)
        if: ${{ github.event.inputs.country == '' || github.event.inputs.country == 'LU' }}
        continue-on-error: true
        timeout-minutes: 12   # PDF downloads from LuxSE
        run: node run-all.js LU

      - name: 🇦🇹 Austria (OeKB)
        if: ${{ github.event.inputs.country == '' || github.event.inputs.country == 'AT' }}
        continue-on-error: true
        timeout-minutes: 12   # PDF downloads from OeKB
        run: node run-all.js AT

      - name: 🇬🇧 United Kingdom (FCA NSM)
        if: ${{ github.event.inputs.country == '' || github.event.inputs.country == 'GB' }}
        continue-on-error: true
        timeout-minutes: 15   # Many FCA PDF fetches
        run: node run-all.js GB

      - name: 🇮🇹 Italy (CONSOB)
        if: ${{ github.event.inputs.country == '' || github.event.inputs.country == 'IT' }}
        continue-on-error: true
        run: node run-all.js IT

      - name: 🇨🇭 Switzerland (FINMA)
        if: ${{ github.event.inputs.country == '' || github.event.inputs.country == 'CH' }}
        continue-on-error: true
        run: node run-all.js CH

      - name: 🇳🇴 Norway (Finanstilsynet)
        if: ${{ github.event.inputs.country == '' || github.event.inputs.country == 'NO' }}
        continue-on-error: true
        run: node run-all.js NO

      # ── Asia-Pacific ────────────────────────────────────────────────────────
      - name: 🇰🇷 South Korea (FSS)
        if: ${{ github.event.inputs.country == '' || github.event.inputs.country == 'KR' }}
        continue-on-error: true
        timeout-minutes: 15   # DART API + ZIP downloads
        run: node run-all.js KR

      - name: 🇸🇬 Singapore (SGX)
        if: ${{ github.event.inputs.country == '' || github.event.inputs.country == 'SG' }}
        continue-on-error: true
        timeout-minutes: 15   # Puppeteer listing + per-filing PDF downloads
        run: node run-all.js SG

      # ── Maintenance ─────────────────────────────────────────────────────────
      - name: 🧹 Cleanup records older than 90 days
        if: ${{ github.event.inputs.country == '' }}  # Only on full runs
        continue-on-error: true
        run: node scrapers/cleanup.js

      # Deletes auth accounts matching the bot/disposable-email blocklist
      # (scrapers/lib/blockedEmails.js) that got past the signup trigger and
      # Turnstile. Paid (pro/elite) accounts are never deleted, only logged.
      - name: 🤖 Delete bot signups
        if: ${{ github.event.inputs.country == '' }}  # Only on full runs
        continue-on-error: true
        run: node scripts/delete-bot-signups.js --confirm

      # ── Scoring & Performance ────────────────────────────────────────────────
      # flag-signals MUST run before score-insiders (see scripts/run-daily.sh):
      # scoring only (re)scores rows with conviction_normalized IS NULL and
      # treats is_unusual_price IS NULL as "not unusual", so scoring first
      # permanently scores option exercises / RSU vestings as real buys.
      - name: 🚩 Flag signals (cluster, repetitive, pre-earnings, price dip)
        if: ${{ github.event.inputs.country == '' }}  # Only on full runs
        continue-on-error: true
        run: node scrapers/flag-signals.js

      - name: 🎯 Score insider conviction
        if: ${{ github.event.inputs.country == '' }}  # Only on full runs
        continue-on-error: true
        run: node scrapers/score-insiders.js

      - name: 📈 Track insider performance (7d/30d/90d returns)
        if: ${{ github.event.inputs.country == '' }}  # Only on full runs
        continue-on-error: true
        run: node scrapers/track-performance.js

      # ── Buyback Programs ────────────────────────────────────────────────────
      - name: 🇳🇴 Norway Buybacks (Oslo Bors cat 1007)
        if: ${{ github.event.inputs.country == '' || github.event.inputs.country == 'NO' }}
        continue-on-error: true
        run: node scrapers/buybacks/norway-buybacks.js

      - name: 🇬🇧 UK Buybacks (FCA NSM)
        if: ${{ github.event.inputs.country == '' || github.event.inputs.country == 'GB' }}
        continue-on-error: true
        run: node scrapers/buybacks/uk-buybacks.js

      # ── Health check ────────────────────────────────────────────────────────
      # Emails jcdeboer@yahoo.com (Resend) on silent scraper failures (no
      # scraper_runs entry for 36h / 0 rows saved twice in a row) and data-
      # quality issues. Needs the RESEND_API_KEY repo secret.
      - name: 🩺 Health check & silent-failure alert
        if: ${{ always() && github.event.inputs.country == '' }}
        continue-on-error: true
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: node scrapers/daily-health-check.js

      # ── Redeploy site ───────────────────────────────────────────────────────
      # Triggers a Vercel production build, which regenerates the static SEO
      # pages + sitemap from today's data (frontend/scripts/build-pages.cjs;
      # keeps the committed pages if generation fails). Needs the
      # VERCEL_DEPLOY_HOOK_URL repo secret (Vercel → Settings → Git → Deploy Hooks).
      - name: 🚀 Redeploy site (regenerate SEO pages)
        if: ${{ github.event.inputs.country == '' }}  # Only on full runs
        continue-on-error: true
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$VERCEL_DEPLOY_HOOK_URL" ]; then
            echo "::warning::VERCEL_DEPLOY_HOOK_URL secret not set — skipping site redeploy"
            exit 0
          fi
          curl -fsS -X POST --retry 3 --max-time 30 "$VERCEL_DEPLOY_HOOK_URL" -o /dev/null
          echo "Vercel deploy hook triggered"

      # ── Summary ─────────────────────────────────────────────────────────────
      - name: 📊 Run summary
        if: always()
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  Insider Tracker — scrape run complete"
          echo "  Triggered by: ${{ github.event_name }}"
          echo "  Country filter: ${{ github.event.inputs.country || 'all' }}"
          echo "  Ref: ${{ github.sha }}"
          echo "  Time: $(date -u '+%Y-%m-%d %H:%M UTC')"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "Check individual step results above for per-country status."
          echo "Steps with continue-on-error: true won't fail the overall job."
