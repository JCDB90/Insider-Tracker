name: Weekly Buyback Scraper

on:
  schedule:
    - cron: '0 7 * * 6'   # 07:00 UTC every Saturday
  workflow_dispatch:       # Manual trigger

env:
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
  RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
  NODE_ENV: production

jobs:
  buybacks:
    name: Scrape buyback programs
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci

      - name: 🇳🇴 Norway Buybacks (Oslo Bors cat 1007)
        continue-on-error: true
        run: node scrapers/buybacks/norway-buybacks.js

      - name: 🇬🇧 UK Buybacks (FCA NSM)
        continue-on-error: true
        run: node scrapers/buybacks/uk-buybacks.js

      - name: 🇸🇪🇩🇰🇫🇮 Nordic Buybacks (Nasdaq Nordic - Changes in own shares)
        continue-on-error: true
        run: node scrapers/buybacks/nordic-buybacks.js

      - name: 🇧🇪 Belgium Buybacks (FSMA STORI)
        continue-on-error: true
        run: node scrapers/buybacks/belgium-buybacks.js

      - name: 🇫🇷🇳🇱🇧🇪 GlobeNewswire Buybacks (FR/NL/BE press releases)
        continue-on-error: true
        run: node scrapers/buybacks/globenewswire-buybacks.js

      - name: 📋 Watchlist IR Monitor (keyword detector)
        continue-on-error: true
        run: node scrapers/buybacks/watchlist-buybacks.js

      - name: 📬 Notify buyback watchlist matches
        continue-on-error: true
        # Requires SUPABASE_SERVICE_ROLE_KEY + RESEND_API_KEY repo secrets to
        # actually send mail — without them this step just logs a warning and
        # sends nothing (same graceful-degradation pattern as notify-watchlist.js).
        run: node scrapers/notify-buyback-watchlist.js

      - name: 📊 Summary
        if: always()
        run: |
          echo "Buyback scrape complete — $(date -u '+%Y-%m-%d %H:%M UTC')"
